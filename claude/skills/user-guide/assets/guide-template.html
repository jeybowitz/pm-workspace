<title>Feature Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
  /* Layout: a step rail on the left, one step at a time on the right with its screenshot; stacks to one column on a phone. */
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --fg: #1d2330;
    --muted: #5d6677;
    --line: #d9dee6;
    --accent: #0b6e8f;
    --accent-soft: #e3f1f6;
    --note-bg: #fff7e6;
    --note-line: #e6c27a;
    --font-body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151920; --surface: #1e242e; --fg: #e7eaf0; --muted: #a3acbb; --line: #333b48;
      --accent: #5cc0e0; --accent-soft: #1b3440; --note-bg: #2d2717; --note-line: #7a6430;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151920; --surface: #1e242e; --fg: #e7eaf0; --muted: #a3acbb; --line: #333b48;
    --accent: #5cc0e0; --accent-soft: #1b3440; --note-bg: #2d2717; --note-line: #7a6430;
    color-scheme: dark;
  }

  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
  .wrap {
    max-width: 1120px; margin: 0 auto;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  .eyebrow { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 1.15; margin: 0; text-wrap: balance; }
  .lede { max-width: 62ch; margin: 0; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start; }
  nav.rail { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 4px; }
  .rail button {
    display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center;
    text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 9px 10px; font: inherit; font-size: 15px; color: var(--fg); cursor: pointer;
  }
  .rail button:hover { background: var(--surface); border-color: var(--line); }
  .rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rail button[aria-current="step"] { background: var(--accent-soft); border-color: transparent; font-weight: 600; }
  .rail .num {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    border: 1.5px solid var(--line); color: var(--muted); background: var(--surface);
  }
  .rail button[aria-current="step"] .num { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rail .progress { margin-top: 12px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .rail .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
  .rail .pos { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .step { display: none; min-width: 0; }
  .step.active { display: block; }
  .step h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
  .step .path { font-size: 14px; color: var(--muted); margin: 0 0 18px; }
  .step .path span:last-child { color: var(--fg); font-weight: 600; }
  .step .path span::after { content: " \203A "; color: var(--muted); }
  .step .path span:last-child::after { content: ""; }
  .step p { max-width: 65ch; margin: 0 0 12px; }
  .ui { font-weight: 600; }

  .shot { margin: 20px 0 0; }
  .shot img { display: block; width: 100%; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .shot .placeholder {
    aspect-ratio: 16 / 9; max-width: 100%; border: 1.5px dashed var(--line); border-radius: 8px;
    display: grid; place-items: center; color: var(--muted); font-size: 15px; text-align: center; padding: 16px; background: var(--surface);
  }
  .shot figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }

  .tip { display: none; }
  .tip.show { display: block; }
  .tip-toggle { margin-top: 16px; background: none; border: none; color: var(--accent); font: inherit; font-size: 15px; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .tip-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tip-body { margin-top: 10px; padding: 12px 14px; background: var(--note-bg); border-left: 3px solid var(--note-line); border-radius: 0 8px 8px 0; max-width: 65ch; }

  .facts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
  .facts li { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }

  .controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
  .btn { font: inherit; font-size: 15px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--muted); }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav.rail { position: static; flex-direction: row; flex-wrap: wrap; }
    .rail button { grid-template-columns: 24px; padding: 6px; }
    .rail button .label { display: none; }
    .rail .num { width: 24px; height: 24px; }
    .rail .progress, .rail .pos { display: none; }
    .hint { display: none; }
    h1 { font-size: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { .rail .progress i { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <div class="layout">
    <nav class="rail" aria-label="Steps" id="rail"></nav>
    <main>
      <div id="steps"></div>
      <div class="controls">
        <button type="button" class="btn" id="prev">Back</button>
        <span class="hint">Use the arrow keys to move between steps</span>
        <button type="button" class="btn primary" id="next">Next</button>
      </div>
    </main>
  </div>
</div>

<script>
  /*
    Fill GUIDE and nothing else. Rules:
    - eyebrow: product and audience, e.g. "Admin panel, platform admin guide".
    - title: the feature as the reader knows it. Also put it in the <title> tag at the top.
    - lede: one or two sentences on what the reader can do.
    - steps[]: one screen each. path is an array of breadcrumb labels, last one is the tab/page the reader lands on.
      body is an array of sentences or short paragraphs; wrap a UI label in <b class="ui">...</b> exactly as shown on screen.
      shots is an array of {src, caption}; leave src "" until the screenshot exists and the page shows a "pending" box.
      tip is optional: {q, a} - one "what if" question and a two-sentence answer.
    - facts[]: the "Good to know" list, at most five one-sentence items. Rendered as the last step.
    Screenshots are published as files under shots/ next to this page, so src is "shots/01-slug.png".
  */
  var GUIDE = {
    eyebrow: "Admin panel, platform admin guide",
    title: "Feature name",
    lede: "One or two sentences on what the reader can do with this feature.",
    steps: [
      {
        title: "First step",
        path: ["Organizer", "Configuration", "Page", "Tab"],
        body: ["What to click, in one sentence. What happens, in one sentence.", "Optional second paragraph with the label <b class=\"ui\">Exact label</b>."],
        shots: [{ src: "", caption: "What the screenshot shows." }],
        tip: { q: "What if I did it by mistake?", a: "How to undo it, in two sentences." }
      }
    ],
    facts: [
      "One fact the reader needs after the steps."
    ]
  };

  (function () {
    var rail = document.getElementById('rail'), stepsEl = document.getElementById('steps');
    document.getElementById('eyebrow').textContent = GUIDE.eyebrow;
    document.getElementById('title').textContent = GUIDE.title;
    document.getElementById('lede').textContent = GUIDE.lede;

    var all = GUIDE.steps.slice();
    if (GUIDE.facts && GUIDE.facts.length) all.push({ title: "Good to know", facts: GUIDE.facts });

    function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    all.forEach(function (s, i) {
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-go', i);
      b.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="label">' + esc(s.title) + '</span>';
      rail.appendChild(b);

      var sec = document.createElement('section');
      sec.className = 'step'; sec.id = 's' + i;
      var html = '<h2>' + esc(s.title) + '</h2>';
      if (s.path) html += '<p class="path">' + s.path.map(function (p) { return '<span>' + esc(p) + '</span>'; }).join('') + '</p>';
      if (s.body) html += s.body.map(function (p) { return '<p>' + p + '</p>'; }).join('');
      if (s.shots) html += s.shots.map(function (sh) {
        var img = sh.src ? '<img src="' + esc(sh.src) + '" alt="' + esc(sh.caption || '') + '">'
                         : '<div class="placeholder">Screenshot: ' + esc(sh.caption || '') + '<br>(pending)</div>';
        return '<figure class="shot">' + img + (sh.caption ? '<figcaption>' + esc(sh.caption) + '</figcaption>' : '') + '</figure>';
      }).join('');
      if (s.tip) html += '<button type="button" class="tip-toggle" aria-expanded="false">' + esc(s.tip.q) + '</button><div class="tip"><div class="tip-body">' + esc(s.tip.a) + '</div></div>';
      if (s.facts) html += '<ul class="facts">' + s.facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
      sec.innerHTML = html;
      stepsEl.appendChild(sec);
    });
    var prog = document.createElement('div'); prog.className = 'progress'; prog.innerHTML = '<i id="bar"></i>'; rail.appendChild(prog);
    var posEl = document.createElement('div'); posEl.className = 'pos'; posEl.id = 'pos'; rail.appendChild(posEl);

    var steps = Array.prototype.slice.call(stepsEl.querySelectorAll('.step'));
    var railBtns = Array.prototype.slice.call(rail.querySelectorAll('button'));
    var prev = document.getElementById('prev'), next = document.getElementById('next');
    var bar = document.getElementById('bar'), pos = document.getElementById('pos');
    var cur = 0;
    try { var h = location.hash.replace('#', ''); if (/^step\d+$/.test(h)) cur = parseInt(h.slice(4), 10) - 1; } catch (e) {}

    function show(i) {
      cur = Math.max(0, Math.min(steps.length - 1, i));
      steps.forEach(function (s, k) { s.classList.toggle('active', k === cur); });
      railBtns.forEach(function (b, k) { if (k === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
      prev.disabled = cur === 0;
      next.textContent = cur === steps.length - 1 ? 'Start again' : 'Next';
      bar.style.width = ((cur + 1) / steps.length * 100) + '%';
      pos.textContent = 'Step ' + (cur + 1) + ' of ' + steps.length;
      try { history.replaceState(null, '', '#step' + (cur + 1)); } catch (e) {}
      try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) {}
    }
    railBtns.forEach(function (b) { b.addEventListener('click', function () { show(parseInt(b.getAttribute('data-go'), 10)); }); });
    prev.addEventListener('click', function () { show(cur - 1); });
    next.addEventListener('click', function () { show(cur === steps.length - 1 ? 0 : cur + 1); });
    document.addEventListener('keydown', function (e) {
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') { show(cur + 1); }
      if (e.key === 'ArrowLeft') { show(cur - 1); }
    });
    Array.prototype.forEach.call(stepsEl.querySelectorAll('.tip-toggle'), function (t) {
      t.addEventListener('click', function () {
        var open = t.getAttribute('aria-expanded') === 'true';
        t.setAttribute('aria-expanded', String(!open));
        t.nextElementSibling.classList.toggle('show', !open);
      });
    });
    show(cur);
  })();
</script>
